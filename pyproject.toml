[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-specialists"
version = "0.1.0"
description = "TUI for managing Hermes agent specialist configurations on OpenShift"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Sawyer Bowerman" },
]
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "InquirerPy>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
hermes-specialists = "hermes_specialists.__main__:main"
hs = "hermes_specialists.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_specialists"]
