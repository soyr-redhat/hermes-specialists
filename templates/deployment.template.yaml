---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ specialist_name }}-data
  labels:
    app: hermes-specialist
    specialist: {{ specialist_name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ storage | default("10Gi") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ specialist_name }}
  labels:
    app: hermes-specialist
    specialist: {{ specialist_name }}
spec:
  replicas: {{ replicas | default(1) }}
  selector:
    matchLabels:
      app: hermes-specialist
      specialist: {{ specialist_name }}
  template:
    metadata:
      labels:
        app: hermes-specialist
        specialist: {{ specialist_name }}
    spec:
      initContainers:
        - name: init-config
          image: {{ image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "cp -r /opt/hermes-init/. /opt/hermes/"]
          volumeMounts:
            - name: specialist-data
              mountPath: /opt/hermes
      containers:
        - name: {{ specialist_name }}
          image: {{ image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "echo '{{ specialist_name }} ready'; exec sleep infinity"]
          resources:
            requests:
              cpu: {{ cpu_request | default("500m") }}
              memory: {{ memory_request | default("1Gi") }}
            limits:
              cpu: {{ cpu_limit | default("2") }}
              memory: {{ memory_limit | default("4Gi") }}
          env:
            - name: HERMES_HOME
              value: /opt/hermes
            - name: HERMES_SPECIALIST
              value: {{ specialist_name }}
            - name: HOME
              value: /opt/hermes
          volumeMounts:
            - name: specialist-data
              mountPath: /opt/hermes
      volumes:
        - name: specialist-data
          persistentVolumeClaim:
            claimName: {{ specialist_name }}-data
